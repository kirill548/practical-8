name: API CI/CD

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Скачиваем код
        uses: actions/checkout@v6

      - name: Устанавливаем Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Устанавливаем зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Проверяем код
        run: ruff check .

      - name: Запускаем тесты
        run: python -m pytest -v

  build-and-push:
    needs: build-and-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Скачиваем код
        uses: actions/checkout@v6

      - name: Настраиваем Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Входим в Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Получаем версию из тега
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Собираем и публикуем образ
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/bmi-api:latest
            ${{ secrets.DOCKER_USERNAME }}/bmi-api:${{ env.VERSION }}
